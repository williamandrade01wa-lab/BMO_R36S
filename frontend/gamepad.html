<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMO Gamepad Emulator</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --body-col: #2d2d44;
    --btn-face: #e94560;
    --btn-face-a: #27ae60;
    --btn-face-b: #e74c3c;
    --btn-face-x: #2980b9;
    --btn-face-y: #f39c12;
    --btn-shoulder: #4a4a6a;
    --btn-system: #3a3a5a;
    --dpad: #2a2a4a;
    --stick: #3d3d5c;
    --stick-knob: #6c6c9a;
    --text: #e0e0f0;
    --text-dim: #888aaa;
    --green: #00d4aa;
    --active-glow: rgba(0, 212, 170, 0.5);
    --pressed: rgba(0, 212, 170, 0.3);
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #555;
    transition: background .3s;
  }
  .status-dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); }

  #status-label { font-weight: 600; }

  /* ── Controller body ── */
  .controller {
    background: var(--body-col);
    border-radius: 30px 30px 50% 50% / 30px 30px 40px 40px;
    width: 480px;
    padding: 18px 24px 30px;
    box-shadow: 0 8px 32px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    grid-template-rows: auto auto auto;
    gap: 12px;
    align-items: center;
  }

  /* ── Shoulders ── */
  .shoulders {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .shoulder-group { display: flex; gap: 6px; }

  /* ── Face buttons ── */
  .face-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 6px;
    width: 110px; height: 110px;
  }
  .face-buttons .pad-btn:nth-child(1) { grid-column:2; grid-row:1; background: var(--btn-face-y); }
  .face-buttons .pad-btn:nth-child(2) { grid-column:1; grid-row:2; background: var(--btn-face-x); }
  .face-buttons .pad-btn:nth-child(3) { grid-column:3; grid-row:2; background: var(--btn-face-a); }
  .face-buttons .pad-btn:nth-child(4) { grid-column:2; grid-row:3; background: var(--btn-face-b); }

  /* ── D-pad ── */
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 36px);
    grid-template-rows: repeat(3, 36px);
    gap: 2px;
    width: 110px; height: 110px;
    align-self: center; justify-self: center;
  }
  .dpad-cell { background: transparent; }
  .dpad .pad-btn { width: 100%; height: 100%; border-radius: 6px; background: var(--dpad); font-size: 15px; }
  .dpad .pad-btn:nth-child(1) { grid-column:2; grid-row:1; }
  .dpad .pad-btn:nth-child(2) { grid-column:1; grid-row:2; }
  .dpad .pad-btn:nth-child(4) { grid-column:3; grid-row:2; }
  .dpad .pad-btn:nth-child(5) { grid-column:2; grid-row:3; }
  .dpad-center { grid-column:2; grid-row:2; background: var(--dpad); border-radius: 4px; }

  /* ── Center cluster ── */
  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .center-row { display: flex; gap: 8px; }
  .pad-btn.system {
    width: 36px; height: 20px;
    border-radius: 10px;
    font-size: 9px;
    background: var(--btn-system);
  }
  .pad-btn.fn-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    font-size: 9px;
    background: var(--surface2);
    border: 1px solid var(--green);
    color: var(--green);
  }

  /* ── Analog sticks ── */
  .sticks-row {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    padding: 0 24px;
  }
  .stick-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .stick {
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--stick);
    position: relative;
    cursor: crosshair;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.5);
    touch-action: none;
  }
  .stick-knob {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--stick-knob);
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    transition: transform .1s;
    pointer-events: none;
  }
  .stick.active .stick-knob { background: var(--green); }
  .stick-label { font-size: 9px; color: var(--text-dim); }

  /* ── Generic button ── */
  .pad-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: rgba(0,0,0,.8);
    transition: filter .05s, transform .05s, box-shadow .05s;
    touch-action: none;
    box-shadow: 0 3px 0 rgba(0,0,0,.4);
  }
  .pad-btn.shoulder {
    width: 52px; height: 28px;
    border-radius: 8px;
    font-size: 10px;
    color: var(--text);
    background: var(--btn-shoulder);
    box-shadow: 0 4px 0 rgba(0,0,0,.5);
  }
  .pad-btn.pressed,
  .pad-btn:active {
    filter: brightness(1.4);
    transform: translateY(2px) scale(.95);
    box-shadow: 0 1px 0 rgba(0,0,0,.4), 0 0 12px var(--active-glow);
  }

  /* ── Log strip ── */
  #log {
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface);
    border-radius: 6px;
    padding: 6px 12px;
    width: 480px;
    height: 38px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  /* ── Keyboard hint ── */
  #kb-hint {
    font-size: 10px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>

<header>
  <div class="status-dot" id="dot"></div>
  <span id="status-label">Aguardando BMO Preview…</span>
  <span style="margin-left:8px;font-size:11px;color:#555">BroadcastChannel: bmo-gamepad</span>
</header>

<div class="controller">

  <!-- Shoulders -->
  <div class="shoulders">
    <div class="shoulder-group">
      <button class="pad-btn shoulder" data-btn="6">L2</button>
      <button class="pad-btn shoulder" data-btn="4">L1</button>
    </div>
    <div class="shoulder-group">
      <button class="pad-btn shoulder" data-btn="5">R1</button>
      <button class="pad-btn shoulder" data-btn="7">R2</button>
    </div>
  </div>

  <!-- Left side: D-pad -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div class="dpad">
      <button class="pad-btn" data-btn="13" title="UP">↑</button>
      <button class="pad-btn" data-btn="15" title="LEFT">←</button>
      <div class="dpad-center"></div>
      <button class="pad-btn" data-btn="16" title="RIGHT">→</button>
      <button class="pad-btn" data-btn="14" title="DOWN">↓</button>
    </div>
    <div style="font-size:9px;color:var(--text-dim)">D-PAD</div>
  </div>

  <!-- Center -->
  <div class="center">
    <div class="center-row">
      <button class="pad-btn system" data-btn="8">SEL</button>
      <button class="pad-btn fn-btn" data-btn="10">FN</button>
      <button class="pad-btn system" data-btn="9">START</button>
    </div>
  </div>

  <!-- Right side: Face buttons -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div class="face-buttons">
      <button class="pad-btn" data-btn="3">Y</button>
      <button class="pad-btn" data-btn="2">X</button>
      <button class="pad-btn" data-btn="1">A</button>
      <button class="pad-btn" data-btn="0">B</button>
    </div>
    <div style="font-size:9px;color:var(--text-dim)">FACE</div>
  </div>

  <!-- Analog sticks (L3 / R3 on click) -->
  <div class="sticks-row">
    <div class="stick-wrap">
      <div class="stick" id="lstick" data-btn="11" title="L3 (clique)">
        <div class="stick-knob"></div>
      </div>
      <span class="stick-label">L3</span>
    </div>
    <div class="stick-wrap">
      <div class="stick" id="rstick" data-btn="12" title="R3 (clique)">
        <div class="stick-knob"></div>
      </div>
      <span class="stick-label">R3</span>
    </div>
  </div>

</div>

<div id="log">Pronto. Clique em qualquer botão para enviar input para o BMO Preview.</div>

<div id="kb-hint">
  Teclado: ← → ↑ ↓ D-pad &nbsp;·&nbsp; Z=B &nbsp;X=A &nbsp;A=Y &nbsp;S=X &nbsp;Q=L1 &nbsp;E=R1 &nbsp;Enter=START &nbsp;Tab=SELECT &nbsp;F=FN
</div>

<script>
// ── HTTP relay (cross-portal via local server) ────────────────────
const RELAY = '/gamepad';
const dot = document.getElementById('dot');
const statusLabel = document.getElementById('status-label');
const logEl = document.getElementById('log');

function log(msg) {
  logEl.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
}

// Heartbeat: poll /gamepad-state to confirm server is up
let connected = false;
function ping() {
  fetch('/gamepad-state', { cache: 'no-store' })
    .then(r => r.json())
    .then(() => {
      if (!connected) {
        connected = true;
        dot.classList.add('connected');
        statusLabel.textContent = 'Relay ativo — BMO Preview sincronizado';
        log('Servidor relay OK — inputs vão para o BMO Preview.');
      }
    })
    .catch(() => {
      connected = false;
      dot.classList.remove('connected');
      statusLabel.textContent = 'Aguardando servidor…';
    });
}
setInterval(ping, 2000);
ping();

// ── Send button command via HTTP POST ─────────────────────────────
const holdTimers = {};

function sendPress(btn) {
  btn = Number(btn);
  clearTimeout(holdTimers[btn]);
  fetch(RELAY, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type: 'press', btn })
  }).catch(() => {});
  // Safety auto-release after 2s in case mouseup is missed
  holdTimers[btn] = setTimeout(() => sendRelease(btn), 2000);
  log('press btn=' + btn + ' (' + (LABEL[btn] || btn) + ')');
}
function sendRelease(btn) {
  btn = Number(btn);
  clearTimeout(holdTimers[btn]);
  fetch(RELAY, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type: 'release', btn })
  }).catch(() => {});
}

// ── Physical button elements ──────────────────────────────────────
const LABEL = ['B','A','X','Y','L1','R1','L2','R2','SEL','START','FN','L3','R3','↑','↓','←','→'];

document.querySelectorAll('[data-btn]').forEach(el => {
  const btn = el.dataset.btn;

  const press = (e) => {
    e.preventDefault();
    el.classList.add('pressed');
    sendPress(btn);
  };
  const release = (e) => {
    e.preventDefault();
    el.classList.remove('pressed');
    sendRelease(btn);
  };

  // click = tap (atomic press+release via server)
  el.addEventListener('click', e => {
    e.preventDefault();
    el.classList.add('pressed');
    fetch(RELAY + '/tap', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ btn: Number(btn) })
    }).catch(() => {});
    log('tap btn=' + btn + ' (' + (LABEL[btn] || btn) + ')');
    setTimeout(() => el.classList.remove('pressed'), 180);
  });
  // mousedown/up = hold (for when you want to hold a button)
  el.addEventListener('mousedown', press);
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('mouseup', release);
  el.addEventListener('mouseleave', release);
  el.addEventListener('touchend', release);
  el.addEventListener('touchcancel', release);
});

// Stick click = L3/R3
['lstick', 'rstick'].forEach(id => {
  const el = document.getElementById(id);
  const btn = el.dataset.btn;
  el.addEventListener('mousedown', e => { e.preventDefault(); el.classList.add('active'); sendPress(btn); });
  el.addEventListener('mouseup', () => { el.classList.remove('active'); sendRelease(btn); });
  el.addEventListener('mouseleave', () => { el.classList.remove('active'); sendRelease(btn); });
});

// ── Keyboard mapping ──────────────────────────────────────────────
const KEY_MAP = {
  'ArrowUp': 13, 'ArrowDown': 14, 'ArrowLeft': 15, 'ArrowRight': 16,
  'z': 0, 'Z': 0,          // B
  'x': 1, 'X': 1,          // A
  'a': 3, 'A': 3,          // Y
  's': 2, 'S': 2,          // X
  'q': 4, 'Q': 4,          // L1
  'e': 5, 'E': 5,          // R1
  'Enter': 9,               // START
  'Tab': 8,                 // SELECT
  'f': 10, 'F': 10          // FN
};

const held = new Set();
document.addEventListener('keydown', e => {
  const btn = KEY_MAP[e.key];
  if (btn === undefined || held.has(btn)) return;
  if (e.key === 'Tab') e.preventDefault();
  held.add(btn);
  sendPress(btn);
  const el = document.querySelector('[data-btn="' + btn + '"]');
  if (el) el.classList.add('pressed');
  log('key ' + e.key + ' → btn ' + btn + ' (' + (LABEL[btn] || btn) + ')');
});
document.addEventListener('keyup', e => {
  const btn = KEY_MAP[e.key];
  if (btn === undefined) return;
  held.delete(btn);
  sendRelease(btn);
  const el = document.querySelector('[data-btn="' + btn + '"]');
  if (el) el.classList.remove('pressed');
});
</script>
</body>
</html>
