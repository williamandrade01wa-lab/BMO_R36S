# BMO Linux Base v0.1 - baseline minimal
#
# Objetivo desta primeira imagem: manter o stack de hardware do R36S
# e remover o desktop XFCE. Nenhum runtime BMO e instalado nesta fase.

BOARD=r36s
BRANCH=lts
RELEASE=trixie

KERNEL_CONFIGURE=no
INSTALL_HEADERS=yes
SHARE_LOGS=no
KERNEL_GIT=shallow

BUILD_DESKTOP=no
BUILD_MINIMAL=yes
